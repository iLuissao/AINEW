<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="solarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Solar Panel Matrix (Diamond / Perspective) -->
  <g transform="translate(106, 96)" filter="url(#shadow)">
    <!-- Main Solar Grid -->
    <rect x="10" y="20" width="280" height="190" rx="18" fill="#0f172a" stroke="url(#solarGold)" stroke-width="6" />
    
    <!-- Panel Cells -->
    <line x1="105" y1="20" x2="105" y2="210" stroke="#334155" stroke-width="3" />
    <line x1="195" y1="20" x2="195" y2="210" stroke="#334155" stroke-width="3" />
    <line x1="10" y1="83" x2="290" y2="83" stroke="#334155" stroke-width="3" />
    <line x1="10" y1="146" x2="290" y2="146" stroke="#334155" stroke-width="3" />

    <!-- Active Cells Highlight -->
    <rect x="18" y="28" width="80" height="48" rx="4" fill="#0284c7" fill-opacity="0.4" />
    <rect x="112" y="28" width="76" height="48" rx="4" fill="#0284c7" fill-opacity="0.6" />
    <rect x="202" y="28" width="80" height="48" rx="4" fill="#0284c7" fill-opacity="0.4" />
    <rect x="112" y="90" width="76" height="48" rx="4" fill="#38bdf8" fill-opacity="0.7" />

    <!-- Lightning Bolt / Energy Badge -->
    <polygon points="150,160 175,230 148,230 162,295 125,215 145,215" fill="url(#solarGold)" />
  </g>

  <!-- Technical Circuit Traces & Dots -->
  <path d="M 90 380 L 170 380 L 210 420 L 320 420 L 350 390 L 420 390" fill="none" stroke="url(#blueGlow)" stroke-width="5" stroke-linecap="round" />
  <circle cx="90" cy="380" r="8" fill="#38bdf8" />
  <circle cx="210" cy="420" r="6" fill="#fbbf24" />
  <circle cx="320" cy="420" r="6" fill="#fbbf24" />
  <circle cx="420" cy="390" r="8" fill="#38bdf8" />

  <!-- App Label Tech Text -->
  <text x="256" y="470" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="3">PV/ESS ENGINE</text>
</svg>
